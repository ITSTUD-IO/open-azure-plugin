name: Sample app CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sample-app:
    name: Test and smoke-test sample app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests and build image
        run: docker build --progress=plain --tag open-azure-plugin-sample:ci ./app

      - name: Smoke-test the container over HTTP
        shell: bash
        run: |
          container="$(docker run -d -p 127.0.0.1::8080 open-azure-plugin-sample:ci)"
          trap 'docker logs "$container" >&2 || true; docker rm -f "$container" >/dev/null || true' EXIT
          address="$(docker port "$container" 8080/tcp)"
          health="$(curl --fail --silent --show-error --retry 8 --retry-connrefused --max-time 2 "http://$address/healthz")"
          test "$health" = '{"status":"ok"}'
          root="$(curl --fail --silent --show-error --max-time 2 "http://$address/")"
          test "$root" = '{"service":"open-azure-plugin-sample"}'
